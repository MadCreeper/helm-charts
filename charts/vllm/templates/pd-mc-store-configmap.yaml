{{- /* Mooncake store.json as a release-owned ConfigMap. The
       MooncakeStoreConnector (rendered onto the engine's --kv-transfer-config
       when pd.localKVOffload.enabled) reads its per-instance config from
       MOONCAKE_CONFIG_PATH, which the chart sets to /etc/mooncake/store.json.
       The master_server_address is this release's own -mc-master Service --
       federated cross-release stores are out of scope for v1. */ -}}
{{- if and .Values.pd.enabled (not .Values.pd.colocate) .Values.pd.localKVOffload.enabled (eq (.Values.pd.localKVOffload.backend | default "") "mooncakeStore") -}}
{{- $fullname := include "vllm.fullname" . -}}
{{- $cfg := .Values.pd.localKVOffload.mooncakeStore -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-mc-store-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-vllm
    component: mc-store
data:
  store.json: |
    {
      "mode": "embedded",
      "metadata_server": "P2PHANDSHAKE",
      "master_server_address": "{{ $fullname }}-mc-master:50051",
      "global_segment_size": "{{ $cfg.globalSegmentSize }}",
      "local_buffer_size": "{{ $cfg.localBufferSize }}",
      "protocol": "rdma",
      "device_name": "",
      "enable_offload": {{ $cfg.enableOffload }}
    }
{{- end -}}
