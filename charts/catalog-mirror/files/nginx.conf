# The whole nginx.conf, not a conf.d snippet: the image's default sets
# `worker_processes auto`, one worker per host CPU regardless of the container's
# limit, which on a 192-core node is ~190 workers and an OOM kill at 128Mi.
worker_processes 2;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    sendfile on;
    server_tokens off;

    server {
        listen 80;
        server_name _;
        root /data;
        autoindex off;

        # The catalog's version files and the helm index are YAML; serve them as text.
        types {
            application/json json;
            text/yaml        yaml yml;
            text/html        html;
            application/gzip tgz;
        }
        default_type application/octet-stream;

        location /model-catalog/ { try_files $uri =404; }
        location /helm-charts/   { try_files $uri =404; }
        location = /status.json  { try_files $uri =404; }

        # Liveness and readiness of nginx itself; the sync container gates the pod on
        # both indexes being there (first sync done).
        location = /healthz { return 200 "ok\n"; }

        location / { return 404; }
    }
}
