apiVersion: v1
kind: Service
metadata:
  name: {{ include "catalog-mirror.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "catalog-mirror.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "catalog-mirror.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
