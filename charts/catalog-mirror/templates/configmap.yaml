apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "catalog-mirror.fullname" . }}-files
  namespace: {{ .Release.Namespace }}
  labels: {{- include "catalog-mirror.labels" . | nindent 4 }}
data:
  sync.py: |-
{{ .Files.Get "files/sync.py" | indent 4 }}
  nginx.conf: |-
{{ .Files.Get "files/nginx.conf" | indent 4 }}
